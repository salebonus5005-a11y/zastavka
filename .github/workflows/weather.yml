name: weather
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download weather
        run: curl -sf "https://api.open-meteo.com/v1/forecast?latitude=58.01&longitude=56.25&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=auto&forecast_days=2" -o weather.json
      - name: Save
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || (git commit -m "Обновил погоду" && git push)