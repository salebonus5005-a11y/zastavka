<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Часы и погода</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8e8e8; overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; cursor: none; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; transition: left 3s ease, top 3s ease; white-space: nowrap; }
  #time { font-size: 11vh; font-weight: 200; line-height: 1; letter-spacing: 0.02em; }
  #sec { font-size: 3.5vh; color: #777; vertical-align: top; margin-left: 0.5vh; }
  #date { font-size: 2.5vh; color: #aaa; margin-top: 0.5vh; }
  #now { margin-top: 2.5vh; font-size: 3vh; display: flex; align-items: center; justify-content: center; gap: 1.5vh; }
  #icon { font-size: 4.5vh; }
  #temp { font-size: 4.5vh; font-weight: 300; }
  #desc { font-size: 1.8vh; color: #bbb; text-align: left; line-height: 1.4; }
  #hours { margin-top: 2vh; display: flex; justify-content: center; gap: 2vh; font-size: 1.5vh; color: #999; }
  #hours div { min-width: 4.5vh; }
  #hours b { display: block; font-size: 2.25vh; font-weight: 300; color: #ddd; margin: 0.3vh 0; }
  #city { margin-top: 1.5vh; font-size: 1.2vh; color: #555; }
</style>
</head>
<body>
<div id="wrap">
  <div><span id="time">--:--</span><span id="sec">--</span></div>
  <div id="date"></div>
  <div id="now">
    <span id="icon"></span>
    <span id="temp"></span>
    <span id="desc">Загружаю погоду…</span>
  </div>
  <div id="hours"></div>
  <div id="city">Пермь</div>
</div>
<script>
var LAT = 58.01, LON = 56.25;
var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var DAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];

function pad(n) { return (n < 10 ? "0" : "") + n; }

function tick() {
  var d = new Date();
  document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  document.getElementById("sec").textContent = pad(d.getSeconds());
  document.getElementById("date").textContent =
    DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
}

function codeInfo(c, isDay) {
  if (c === 0) return [isDay ? "☀️" : "🌙", "Ясно"];
  if (c === 1) return [isDay ? "🌤️" : "🌙", "Малооблачно"];
  if (c === 2) return ["⛅", "Переменная облачность"];
  if (c === 3) return ["☁️", "Пасмурно"];
  if (c === 45 || c === 48) return ["🌫️", "Туман"];
  if (c >= 51 && c <= 57) return ["🌦️", "Морось"];
  if (c >= 61 && c <= 67) return ["🌧️", "Дождь"];
  if (c >= 71 && c <= 77) return ["🌨️", "Снег"];
  if (c >= 80 && c <= 82) return ["🌧️", "Ливень"];
  if (c === 85 || c === 86) return ["🌨️", "Снегопад"];
  if (c >= 95) return ["⛈️", "Гроза"];
  return ["", ""];
}

function sign(t) { t = Math.round(t); return (t > 0 ? "+" : "") + t + "°"; }

// Загрузка JSON старым надёжным способом, с ограничением по времени
function getJSON(url, ok, fail) {
  var done = false;
  var x = new XMLHttpRequest();
  var timer = setTimeout(function () {
    if (done) return; done = true;
    try { x.abort(); } catch (e) {}
    fail("нет ответа");
  }, 15000);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || done) return;
    done = true; clearTimeout(timer);
    if (x.status !== 200) { fail("ошибка " + x.status); return; }
    var data;
    try { data = JSON.parse(x.responseText); } catch (e) { fail("плохой ответ"); return; }
    ok(data);
  };
  try { x.open("GET", url, true); x.send(); }
  catch (e) { done = true; clearTimeout(timer); fail("запрос не отправлен"); }
}

// Время "2026-11-12T18:00" → часы (без разбора даты браузером)
function hourOf(s) { return parseInt(s.substr(11, 2), 10); }
function dayOf(s) { return s.substr(0, 10); }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function show(icon, temp, descHtml, hoursHtml) {
  document.getElementById("icon").textContent = icon;
  document.getElementById("temp").textContent = temp;
  document.getElementById("desc").innerHTML = descHtml;
  document.getElementById("hours").innerHTML = hoursHtml;
}

// Сервис 1: Open-Meteo
var OM_URL = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
    "&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min" +
    "&wind_speed_unit=ms&timezone=auto&forecast_days=2";
// Сервис 3: копия погоды на нашем же сайте (её обновляет GitHub)
var LOCAL_URL = "weather.json";

function fromOpenMeteo(ok, fail, url) {
  getJSON((url || OM_URL) + (url ? "?t=" + new Date().getTime() : ""), function (w) {
    try {
      var c = w.current;
      var info = codeInfo(c.weather_code, c.is_day);
      var desc = info[1] + "<br>Ощущается " + sign(c.apparent_temperature) +
        " · ветер " + Math.round(c.wind_speed_10m) + " м/с<br>Днём " +
        sign(w.daily.temperature_2m_min[0]) + " … " + sign(w.daily.temperature_2m_max[0]);
      var now = new Date(), today = todayStr(), html = "", shown = 0;
      for (var i = 0; i < w.hourly.time.length && shown < 5; i++) {
        var s = w.hourly.time[i], h = hourOf(s);
        if (dayOf(s) < today || (dayOf(s) === today && h <= now.getHours()) || h % 3 !== 0) continue;
        var hi = codeInfo(w.hourly.weather_code[i], h >= 7 && h <= 19);
        html += "<div>" + pad(h) + ":00<b>" + sign(w.hourly.temperature_2m[i]) + "</b>" + hi[0] + "</div>";
        shown++;
      }
      show(info[0], sign(c.temperature_2m), desc, html);
      ok();
    } catch (e) { fail("не разобрал данные"); }
  }, fail);
}

// Значки для кодов сервиса wttr.in
function wwoIcon(code) {
  code = parseInt(code, 10);
  if (code === 113) return "☀️";
  if (code === 116) return "⛅";
  if (code === 119 || code === 122) return "☁️";
  if (code === 143 || code === 248 || code === 260) return "🌫️";
  if (code === 200 || code >= 386) return "⛈️";
  if (code === 179 || code === 227 || code === 230 || (code >= 323 && code <= 338) || code === 368 || code === 371) return "🌨️";
  return "🌧️";
}

// Сервис 2 (запасной): wttr.in
function fromWttr(ok, fail) {
  getJSON("https://wttr.in/Perm?format=j1&lang=ru", function (w) {
    try {
      var c = w.current_condition[0];
      var text = (c.lang_ru && c.lang_ru[0]) ? c.lang_ru[0].value : "";
      var day = w.weather[0];
      var desc = text + "<br>Ощущается " + sign(+c.FeelsLikeC) +
        " · ветер " + Math.round(c.windspeedKmph / 3.6) + " м/с<br>Днём " +
        sign(+day.mintempC) + " … " + sign(+day.maxtempC);
      var nowH = new Date().getHours(), html = "", shown = 0;
      for (var d = 0; d < w.weather.length && shown < 5; d++) {
        var hrs = w.weather[d].hourly;
        for (var i = 0; i < hrs.length && shown < 5; i++) {
          var h = parseInt(hrs[i].time, 10) / 100;
          if (d === 0 && h <= nowH) continue;
          html += "<div>" + pad(h) + ":00<b>" + sign(+hrs[i].tempC) + "</b>" + wwoIcon(hrs[i].weatherCode) + "</div>";
          shown++;
        }
      }
      show(wwoIcon(c.weatherCode), sign(+c.temp_C), desc, html);
      ok();
    } catch (e) { fail("не разобрал данные"); }
  }, fail);
}

var retryTimer = null;
function loadWeather() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  fromOpenMeteo(function () {}, function (why1) {
    fromOpenMeteo(function () {}, function (why2) {
      fromWttr(function () {}, function (why3) {
        // Если погода уже была, оставляем её; иначе пишем причину
        if (!document.getElementById("temp").textContent) {
          document.getElementById("desc").innerHTML =
            "Погода пока не загрузилась<br><small style='color:#666'>" + why1 + " / " + why2 + " / " + why3 + ", пробую ещё раз…</small>";
        }
        retryTimer = setTimeout(loadWeather, 60 * 1000);
      });
    }, LOCAL_URL);
  });
}

// Медленно сдвигаем картинку, чтобы экран не «выгорал»
function drift() {
  var w = document.getElementById("wrap");
  w.style.left = (40 + Math.random() * 20) + "%";
  w.style.top = (40 + Math.random() * 20) + "%";
}

// Нажатие OK на пульте — во весь экран
document.addEventListener("click", function () {
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

tick(); setInterval(tick, 1000);
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);
setInterval(drift, 60 * 1000);
</script>
</body>
</html>
